site_name: Pokémon Null AI Documentation
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: red
      accent: green
  logo: assets/logo.png
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - Changelog: changelog.md
  - Switch AI: switch-ai.md
  - Support Pokémon: support-pokemon.md
  - Move Scoring:
      - Overview: move-scoring.md
      - Scoring Reference: move-scoring-reference.md
      - Damage Move Usability Checks: usability.md
  - FAQ: faq.md
  - Mechanics Changes: mechanics-changes.md
  - Pokémon Null Resources: resources.md
  - Changelog: changelog.md
site_url: https://jellytronical.github.io/Null-AI-Documentation/
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: admonition
          class: admonition
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
