site_name: Pokemon Null AI Documentation
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: red
      accent: green
  logo: assets/logo.png
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - Switch AI: switch-ai.md
  - Support pokemon: support-pokemon.md
  - Move scoring:
      - Overview: move-scoring.md
      - Scoring reference: move-scoring-reference.md
  - FAQ: faq.md
site_url: https://jellytronical.github.io/Null-AI-Documentation/
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
